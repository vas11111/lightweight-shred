[package]
name = "lightweight-shred"
version = "0.1.0"
edition = "2021"
description = "Vendored Solana shred parsing and FEC recovery — without rocksdb/protobuf/openssl"

[dependencies]
# Solana types
solana-hash = "4.4"
solana-pubkey = "4.2"
solana-signature = { version = "3.4.1", features = ["serde", "std", "verify", "wincode"] }
solana-sha256-hasher = "3.1"

# Shred processing
bytes = "1.12"
reed-solomon-erasure = { version = "6.0", features = ["simd-accel"] }
lazy-lru = "0.1"
wincode = { version = "0.5.5", features = ["derive", "bytes"] }

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
bitflags = { version = "2.13", features = ["serde"] }
num_enum = "0.7.6"
static_assertions = "1.1"
itertools = "0.15"
assert_matches = "1.5"
thiserror = "2.0"
