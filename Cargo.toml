[package]
name = "lightweight-shred"
version = "0.1.0"
edition = "2021"
description = "Vendored Solana shred parsing and FEC recovery — without rocksdb/protobuf/openssl"

[dependencies]
# Solana types
solana-hash = "4.2"
solana-pubkey = "4.1"
solana-signature = { version = "3.3", features = ["serde", "std", "verify"] }
solana-sha256-hasher = "3.1"
solana-signer = "3.0"

# Shred processing
bytes = "1.11"
reed-solomon-erasure = "6.0"
lazy-lru = "0.1"
wincode = { version = "0.4.4", features = ["derive"] }

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
bitflags = { version = "2.11", features = ["serde"] }
num_enum = "0.7"
static_assertions = "1.1"
itertools = "0.14"
assert_matches = "1.5"
thiserror = "2.0"
